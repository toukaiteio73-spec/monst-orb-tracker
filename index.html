<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💎 モンスト オーブ管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#f4f7ff;margin:0;padding:18px}main{max-width:650px;margin:auto}h1{font-size:23px}.panel{background:#18223a;border:1px solid #2b3958;border-radius:18px;padding:17px;margin:13px 0}.muted{color:#a8b9d6;font-size:13px;line-height:1.6}.big{font-size:44px;font-weight:800;margin:8px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cards .panel{margin:0}button,input::file-selector-button{background:#457bfa;color:white;border:0;border-radius:10px;padding:12px;font-weight:700}input{max-width:100%}textarea{box-sizing:border-box;width:100%;height:110px;border-radius:10px;padding:10px;background:#0b1020;color:white;border:1px solid #52617b}svg{width:100%;height:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 4px;border-bottom:1px solid #34415a;text-align:left}#status{color:#b9e8c7;white-space:pre-wrap}small{color:#a8b9d6}</style></head><body><main><h1>💎 モンスト オーブ管理</h1><p class="muted">記録をまとめてグラフ化・重複は自動整理</p><div class="panel"><div class="muted">最新の所持オーブ</div><div class="big" id="latest">377 個</div><div id="date" class="muted"></div></div><div class="cards"><div class="panel"><div class="muted">前回からの増減</div><h2 id="diff">—</h2></div><div class="panel"><div class="muted">記録数</div><h2 id="count">—</h2></div></div><div class="panel"><h3>📈 オーブ推移</h3><div id="chart"></div></div><div class="panel"><h3>📁 記録を追加</h3><p class="muted">複数の monst_orbs テキストファイルをまとめて選択できるよ。以前の記録は残したまま追加するよ。</p><input type="file" id="file" accept=".txt,text/plain" multiple><p id="status" aria-live="polite"></p><p class="muted">ファイル選択が動かない場合は、下に記録テキストを貼り付けて「追加」を押してね。</p><textarea id="paste" placeholder="日付：2026/11/06 12:00&#10;所持オーブ：380"></textarea><p><button id="add">貼り付けた記録を追加</button></p></div><div class="panel"><h3>📋 記録履歴</h3><table><thead><tr><th>日時</th><th>オーブ</th><th>増減</th></tr></thead><tbody id="history"></tbody></table></div><div class="panel"><button id="export">記録をTXTで保存</button><p class="muted">この端末・ブラウザ内に記録を保存。別のアプリやプレビューでは保存が共有されない場合があるので、TXTでもバックアップしてね。</p></div><small>数値の差は純増減で、獲得と消費の内訳ではありません。</small></main><script>
const seed=[['2026/11/04 23:22',355],['2026/11/04 23:47',355],['2026/11/04 23:58',355],['2026/11/04 23:58',356],['2026/11/05 0:08',356],['2026/11/05 0:09',356],['2026/11/05 23:02',377],['2026/11/05 23:03',377],['2026/11/05 23:04',377],['2026/11/05 23:06',377]];
const key='monst_orbs_records_v2';let records;try{records=JSON.parse(localStorage.getItem(key))||seed}catch(e){records=seed.slice()}
function normalizedDate(s){const m=s.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\s+(\d{1,2}):(\d{2})/);return m?`${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')} ${m[4].padStart(2,'0')}:${m[5]}`:null}
function parse(t){const re=/日付\s*[：:]\s*(\d{4}[\/-]\d{1,2}[\/-]\d{1,2}\s+\d{1,2}:\d{2})[\s\S]*?所持オーブ\s*[：:]\s*([\d,]+)/g;let m,out=[];while((m=re.exec(t))!==null)out.push([normalizedDate(m[1]),Number(m[2].replaceAll(',',''))]);return out}
function merge(items){const before=records.length;const seen=new Set(records.map(x=>x.join('|')));for(const item of items){if(!item[0]||!Number.isFinite(item[1]))continue;const id=item.join('|');if(!seen.has(id)){records.push(item);seen.add(id)}}records.sort((a,b)=>a[0].localeCompare(b[0])||a[1]-b[1]);try{localStorage.setItem(key,JSON.stringify(records))}catch(e){}render();return records.length-before}
function render(){const a=records;if(!a.length)return;const last=a.at(-1);document.getElementById('latest').textContent=last[1].toLocaleString()+' 個';document.getElementById('date').textContent=last[0];document.getElementById('count').textContent=a.length+' 件';const d=a.length>1?last[1]-a.at(-2)[1]:null;document.getElementById('diff').textContent=d===null?'—':(d>0?'+':'')+d+' 個';document.getElementById('history').innerHTML=a.slice().reverse().map((r,i)=>{const prev=a[a.length-2-i];const diff=prev?r[1]-prev[1]:null;return `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${diff===null?'—':(diff>0?'+':'')+diff}</td></tr>`}).join('');if(a.length<2)return;const w=560,h=250,p=40,vals=a.map(x=>x[1]),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(10,max-min),low=Math.max(0,min-span*.2),high=max+span*.2,x=i=>p+(w-2*p)*i/(a.length-1),y=v=>h-p-(h-2*p)*(v-low)/(high-low);document.getElementById('chart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="オーブ数の推移"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#667896"/><path d="${a.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(r[1]).toFixed(1)).join(' ')}" fill="none" stroke="#6cc9ff" stroke-width="3"/>${a.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[1])}" r="3.5" fill="#a1e6ff"/>`).join('')}<text x="${p}" y="${h-8}" fill="#b5c8e7" font-size="12">${a[0][0].slice(0,10)}</text><text x="${w-p}" y="${h-8}" text-anchor="end" fill="#b5c8e7" font-size="12">${last[0].slice(0,10)}</text><text x="${p}" y="20" fill="#b5c8e7" font-size="13">${max} 個</text></svg>`}
merge([]);document.getElementById('file').addEventListener('change',async e=>{const fs=[...e.target.files];let all=[];try{for(const f of fs)all.push(...parse(await f.text()));const added=merge(all);document.getElementById('status').textContent=`${fs.length}ファイルから${all.length}件を検出。新規${added}件を追加したよ！`;e.target.value=''}catch(err){document.getElementById('status').textContent='読み込みに失敗したよ。下の貼り付け欄を試してね。'}});document.getElementById('add').onclick=()=>{const a=parse(document.getElementById('paste').value),n=merge(a);document.getElementById('status').textContent=a.length?`${a.length}件を検出、新規${n}件を追加したよ！`:'記録が見つからなかったよ。日付と所持オーブを確認してね。'};document.getElementById('export').onclick=()=>{const t=records.map(r=>`日付：${r[0]}\n所持オーブ：${r[1]}`).join('\n');const u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='monst_orbs_backup.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
</script></body></html>
